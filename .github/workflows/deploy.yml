name: deploy

# Deploys the app to Fly.io from GitHub's runners, which have clean outbound
# network access to Fly's remote builder. Runs on every push to main (i.e.
# after a PR merges) and can be triggered by hand via the Actions tab.
#
# Requires a repository secret named FLY_API_TOKEN
# (Settings → Secrets and variables → Actions → New repository secret).
# Generate one with: fly tokens create deploy -a warp-codx

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; let an in-flight deploy finish rather than
# cancelling it half-way.
concurrency:
  group: deploy-fly
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
